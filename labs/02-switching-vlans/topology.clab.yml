# Lab 02: Switching, VLANs and trunks
#
#   VLAN 10 (10.10.10.0/24)   h1 .11 ---+            +--- h2 .12
#                                       sw1 ==trunk== sw2
#   VLAN 20 (10.20.20.0/24)   h3 .13 ---+  ||        +--- h4 .14
#                                          || trunk
#                                          r1  (router on a stick, .1 in each VLAN)
#
# sw1 is fully configured. sw2 is a plain bridge with no VLANs: that's your job.
name: lab02

topology:
  defaults:
    kind: linux
    image: nicolaka/netshoot:v0.13
    cmd: sleep infinity

  nodes:
    sw1:
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        # access ports: one untagged VLAN each
        - bridge vlan del dev eth1 vid 1
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan del dev eth2 vid 1
        - bridge vlan add dev eth2 vid 20 pvid untagged
        # trunk ports: VLANs 10 and 20 tagged
        - bridge vlan del dev eth3 vid 1
        - bridge vlan add dev eth3 vid 10
        - bridge vlan add dev eth3 vid 20
        - bridge vlan del dev eth4 vid 1
        - bridge vlan add dev eth4 vid 10
        - bridge vlan add dev eth4 vid 20
    sw2:
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
    r1:
      image: frrouting/frr:v8.4.1
      cmd: /usr/lib/frr/docker-start
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
        - r1/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ip link set eth1.10 up
        - ip link set eth1.20 up
    h1:
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.10.10.1
    h2:
      exec:
        - ip addr add 10.10.10.12/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.10.10.1
    h3:
      exec:
        - ip addr add 10.20.20.13/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.20.20.1
    h4:
      exec:
        - ip addr add 10.20.20.14/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.20.20.1

  links:
    - endpoints: ["h1:eth1", "sw1:eth1"]
    - endpoints: ["h3:eth1", "sw1:eth2"]
    - endpoints: ["sw1:eth3", "sw2:eth3"]
    - endpoints: ["sw1:eth4", "r1:eth1"]
    - endpoints: ["h2:eth1", "sw2:eth1"]
    - endpoints: ["h4:eth1", "sw2:eth2"]
