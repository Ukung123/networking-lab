# Lab 05: DHCP and DNS
#
#   srv 10.5.0.2 (dnsmasq)    web 10.5.0.80     h1 (DHCP)     h2 (DHCP)
#      |                         |                  |             |
#   +--------------------------- sw ------------------------------+
#                         10.5.0.0/24, domain lab.local
#
# h1 and h2 start with no IP address. They'll get one from srv over DHCP.
name: lab05

topology:
  defaults:
    kind: linux
    image: nicolaka/netshoot:v0.13
    cmd: sleep infinity

  nodes:
    sw:
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
    srv:
      image: 4km3/dnsmasq:2.90-r3-alpine-3
      entrypoint: /bin/sleep
      cmd: infinity
      binds:
        - srv:/etc/dnsmasq.d
      exec:
        - ip addr add 10.5.0.2/24 dev eth1
        - dnsmasq --conf-file=/etc/dnsmasq.d/dnsmasq.conf
    web:
      exec:
        - ip addr add 10.5.0.80/24 dev eth1
    h1: {}
    h2: {}

  links:
    - endpoints: ["srv:eth1", "sw:eth1"]
    - endpoints: ["web:eth1", "sw:eth2"]
    - endpoints: ["h1:eth1", "sw:eth3"]
    - endpoints: ["h2:eth1", "sw:eth4"]
