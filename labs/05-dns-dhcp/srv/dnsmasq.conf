# dnsmasq: a small DNS + DHCP server. Edit this file, then reload with:
#   bash labs/05-dns-dhcp/reload-dns.sh

# Only serve the lab LAN, never the management network on eth0
interface=eth1
bind-interfaces
no-resolv            # don't forward unknown names to the internet
log-queries
log-dhcp
log-facility=/var/log/dnsmasq.log   # watch it: docker exec clab-lab05-srv tail -f /var/log/dnsmasq.log

# ---------- DNS ----------
domain=lab.local
local=/lab.local/    # we are authoritative for lab.local
expand-hosts         # "web" also answers as "web.lab.local"
addn-hosts=/etc/dnsmasq.d/lab.hosts

# ---------- DHCP ----------
# Hand out 10.5.0.100 - 10.5.0.150, leases last 1 hour
dhcp-range=10.5.0.100,10.5.0.150,255.255.255.0,1h
dhcp-option=option:dns-server,10.5.0.2
dhcp-option=option:domain-name,lab.local
dhcp-authoritative

