# Lab 01: IP addressing and subnets
# Four hosts plugged into one switch (a Linux bridge).
#
#        h1 .10    h2 .20    h3 .130   h4 (you)
#          |         |         |         |
#        +-------------- sw ----------------+
#              192.168.1.0/24
name: lab01

topology:
  defaults:
    kind: linux
    image: nicolaka/netshoot:v0.13
    cmd: sleep infinity

  nodes:
    sw:
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
    h1:
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
    h2:
      exec:
        - ip addr add 192.168.1.20/24 dev eth1
    h3:
      exec:
        - ip addr add 192.168.1.130/25 dev eth1   # deliberately wrong mask
    h4: {}

  links:
    - endpoints: ["h1:eth1", "sw:eth1"]
    - endpoints: ["h2:eth1", "sw:eth2"]
    - endpoints: ["h3:eth1", "sw:eth3"]
    - endpoints: ["h4:eth1", "sw:eth4"]
