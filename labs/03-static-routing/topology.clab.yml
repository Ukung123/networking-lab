# Lab 03: Static routing
#
#  h1 ---- r1 ---------- r2 ---------- r3 ---- h2
#  .10  .1    .1  10.0.12.0/30  .2 .1  10.0.23.0/30 .2   .1   .10
#  10.1.1.0/24                                      10.3.3.0/24
#
# Every interface has its address, but no router has any routes yet.
name: lab03

topology:
  defaults:
    kind: linux
    image: nicolaka/netshoot:v0.13
    cmd: sleep infinity

  nodes:
    r1:
      image: frrouting/frr:v8.4.1
      cmd: /usr/lib/frr/docker-start
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
        - r1/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      image: frrouting/frr:v8.4.1
      cmd: /usr/lib/frr/docker-start
      binds:
        - r2/daemons:/etc/frr/daemons
        - r2/frr.conf:/etc/frr/frr.conf
        - r2/vtysh.conf:/etc/frr/vtysh.conf
    r3:
      image: frrouting/frr:v8.4.1
      cmd: /usr/lib/frr/docker-start
      binds:
        - r3/daemons:/etc/frr/daemons
        - r3/frr.conf:/etc/frr/frr.conf
        - r3/vtysh.conf:/etc/frr/vtysh.conf
    h1:
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.1.1
    h2:
      exec:
        - ip addr add 10.3.3.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.3.1

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "h2:eth1"]
