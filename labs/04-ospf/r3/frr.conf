frr defaults traditional
hostname r3
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 description router ID
 ip address 10.255.0.3/32
exit
!
interface eth1
 description link to r1
 ip address 10.0.13.2/30
exit
!
interface eth2
 description link to r2
 ip address 10.0.23.2/30
exit
!
interface eth3
 description LAN to h2
 ip address 10.3.3.1/24
exit
!
! ospfd is running, but OSPF is not configured yet: that's your job.
!
line vty
!
